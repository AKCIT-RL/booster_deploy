<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Fluxo de dados — MuJoCo (sim2sim, processo único)</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748b">Único processo — sem ROS 2, sem SDK, sem memória compartilhada</text>

  <rect x="60" y="80" width="220" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="170" y="99" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">mj_data (estado físico)</text>
  <text x="170" y="114" text-anchor="middle" font-size="9" fill="#166534">qpos, qvel</text>

  <line x1="170" y1="126" x2="170" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="45" y="152" width="250" height="60" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="170" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">update_state()</text>
  <text x="170" y="187" text-anchor="middle" font-size="9" fill="#065f46">qpos[7:]/qvel[6:] → joint_pos/vel</text>
  <text x="170" y="200" text-anchor="middle" font-size="9" fill="#065f46">qvel[:3] usado como lin_vel_b (é world!)</text>

  <line x1="170" y1="212" x2="170" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="45" y="238" width="250" height="46" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="170" y="257" text-anchor="middle" font-size="11" font-weight="600" fill="#064e3b">policy.inference()</text>
  <text x="170" y="272" text-anchor="middle" font-size="9" fill="#065f46">retorna dof_targets</text>

  <line x1="295" y1="261" x2="360" y2="261" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="362" y="150" width="300" height="230" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="512" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">ctrl_step() — laço interno</text>
  <text x="512" y="188" text-anchor="middle" font-size="10" fill="#334155">repete "decimation" vezes (padrão 10)</text>

  <rect x="380" y="200" width="264" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="512" y="216" text-anchor="middle" font-size="10" font-weight="600" fill="#7f1d1d">torque = kp·(alvo − pos) − kd·vel</text>
  <text x="512" y="230" text-anchor="middle" font-size="9" fill="#991b1b">kd = 0 sempre (esperando damping do MJCF)</text>

  <line x1="512" y1="240" x2="512" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="380" y="260" width="264" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="512" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#78350f">clip pela curva T-N (opcional)</text>
  <text x="512" y="292" text-anchor="middle" font-size="9" fill="#92400e">se velocity_limit/knee_point definidos</text>

  <line x1="512" y1="306" x2="512" y2="324" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>

  <rect x="380" y="326" width="264" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="512" y="342" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">mj_data.ctrl = clip(torque)</text>
  <text x="512" y="356" text-anchor="middle" font-size="9" fill="#166534">mujoco.mj_step() — avança 1 sub-passo</text>

  <path d="M 512 366 C 470 400, 470 400, 460 260" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#b1)"/>
  <text x="700" y="366" text-anchor="middle" font-size="9" fill="#475569" transform="rotate(0)">repete até</text>
  <text x="700" y="378" text-anchor="middle" font-size="9" fill="#475569">decimation sub-passos</text>

  <line x1="512" y1="380" x2="512" y2="405" stroke="#64748b" stroke-width="2" marker-end="url(#b1)"/>
  <rect x="392" y="407" width="240" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="512" y="428" text-anchor="middle" font-size="10" fill="#1e293b">próximo passo de política (policy_dt)</text>

  <text x="450" y="475" text-anchor="middle" font-size="11" fill="#64748b">physics_dt = policy_dt / decimation  (padrão: 0.02 / 10 = 0.002 s → 500 Hz)</text>
  <text x="450" y="495" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">Para o T1: MJCF não declara joint damping ⇒ o kd forçado a 0 nunca é "compensado".</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
</svg>
