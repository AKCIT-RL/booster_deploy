<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Tornozelo do T1: um mecanismo paralelo visto como junta serial</text>

  <!-- ===== coluna 1: mecanismo fisico ===== -->
  <rect x="24" y="52" width="290" height="278" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="169" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">1. O mecanismo físico</text>
  <text x="169" y="92" text-anchor="middle" font-size="9" fill="#b45309">T1_23dof_parallel.xml:143-168</text>

  <!-- tibia -->
  <rect x="157" y="104" width="24" height="150" rx="3" fill="#e2e8f0" stroke="#64748b"/>
  <text x="169" y="118" text-anchor="middle" font-size="9" fill="#475569">tíbia</text>

  <!-- drive a (esquerda) -->
  <circle cx="157" cy="150" r="5" fill="#d97706"/>
  <line x1="157" y1="150" x2="120" y2="160" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="124" y2="244" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="124" cy="244" r="3.5" fill="#d97706"/>
  <text x="112" y="142" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">drive_a</text>
  <text x="103" y="205" text-anchor="middle" font-size="8" fill="#b45309">biela</text>

  <!-- drive b (direita) -->
  <circle cx="181" cy="186" r="5" fill="#2563eb"/>
  <line x1="181" y1="186" x2="218" y2="196" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="218" y1="196" x2="214" y2="244" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="214" cy="244" r="3.5" fill="#2563eb"/>
  <text x="232" y="180" text-anchor="middle" font-size="9" font-weight="600" fill="#1e3a8a">drive_b</text>

  <!-- pe -->
  <rect x="92" y="246" width="154" height="13" rx="3" fill="#cbd5e1" stroke="#475569"/>
  <circle cx="169" cy="246" r="5" fill="#334155"/>
  <text x="169" y="274" text-anchor="middle" font-size="9" fill="#475569">pé — dois graus de liberdade, nenhum motor</text>

  <text x="169" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">drives em fase  →  pitch</text>
  <text x="169" y="314" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">drives em oposição  →  roll</text>

  <!-- ===== coluna 2: fronteira do firmware ===== -->
  <rect x="334" y="52" width="292" height="278" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">2. A fronteira do firmware</text>
  <text x="480" y="92" text-anchor="middle" font-size="9" fill="#5b21b6">um campo escolhe o espaço de coordenadas</text>

  <rect x="392" y="106" width="176" height="36" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="480" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">LowCmd.cmd_type</text>

  <line x1="430" y1="142" x2="412" y2="176" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a2)"/>
  <line x1="530" y1="142" x2="550" y2="176" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a1)"/>

  <rect x="350" y="180" width="124" height="84" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="412" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">PARALLEL (0)</text>
  <text x="412" y="216" text-anchor="middle" font-size="9" fill="#94a3b8">slots 15/16/21/22 =</text>
  <text x="412" y="229" text-anchor="middle" font-size="9" fill="#94a3b8">kCrankUp / kCrankDown</text>
  <text x="412" y="248" text-anchor="middle" font-size="8.5" fill="#94a3b8">default do IDL;</text>
  <text x="412" y="259" text-anchor="middle" font-size="8.5" fill="#94a3b8">não usado pelo deploy</text>

  <rect x="488" y="180" width="124" height="84" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="550" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">SERIAL (1)</text>
  <text x="550" y="216" text-anchor="middle" font-size="9" fill="#5b21b6">slots 15/16/21/22 =</text>
  <text x="550" y="229" text-anchor="middle" font-size="9" fill="#5b21b6">Ankle_Pitch / Ankle_Roll</text>
  <text x="550" y="248" text-anchor="middle" font-size="8.5" fill="#5b21b6">o firmware resolve</text>
  <text x="550" y="259" text-anchor="middle" font-size="8.5" fill="#5b21b6">a cinemática do mecanismo</text>

  <text x="480" y="290" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4c1d95">booster_robot_controller.py:282 é a única linha</text>
  <text x="480" y="304" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4c1d95">que tira o comando do default PARALLEL</text>
  <text x="480" y="320" text-anchor="middle" font-size="9" fill="#5b21b6">LowState publica os dois espaços de volta, sempre</text>

  <!-- ===== coluna 3: o que cada lado ve ===== -->
  <rect x="646" y="52" width="290" height="278" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="791" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">3. O que cada lado vê</text>

  <rect x="666" y="92" width="250" height="92" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="791" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">MuJoCo — T1_23dof.xml</text>
  <text x="791" y="131" text-anchor="middle" font-size="9.5" fill="#166534">duas hinges independentes, dois motors</text>
  <text x="791" y="146" text-anchor="middle" font-size="9.5" fill="#166534">pitch ±73,1 N·m · roll ±17,2 N·m</text>
  <text x="791" y="161" text-anchor="middle" font-size="9.5" fill="#166534">nq 30 · nv 29 · nu 23</text>
  <text x="791" y="176" text-anchor="middle" font-size="9" fill="#15803d">o mecanismo é só um mesh de visualização</text>

  <text x="791" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">≠</text>

  <rect x="666" y="218" width="250" height="92" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="791" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Robô real — firmware</text>
  <text x="791" y="257" text-anchor="middle" font-size="9.5" fill="#1d4ed8">um mecanismo, dois motores de ±43 N·m</text>
  <text x="791" y="272" text-anchor="middle" font-size="9.5" fill="#1d4ed8">pitch e roll dividem o mesmo par</text>
  <text x="791" y="287" text-anchor="middle" font-size="9.5" fill="#1d4ed8">loop fechado, jacobiano variável</text>
  <text x="791" y="302" text-anchor="middle" font-size="9" fill="#2563eb">tau_est é torque equivalente, não do motor</text>

  <!-- ===== faixa inferior: divergencias ===== -->
  <rect x="24" y="348" width="912" height="248" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">As quatro divergências que a abstração serial esconde</text>

  <rect x="40" y="392" width="212" height="136" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="146" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">(a) Sem acoplamento</text>
  <text x="146" y="436" text-anchor="middle" font-size="9" fill="#991b1b">Na sim, pitch e roll têm tetos de</text>
  <text x="146" y="449" text-anchor="middle" font-size="9" fill="#991b1b">torque independentes.</text>
  <text x="146" y="468" text-anchor="middle" font-size="9" fill="#991b1b">No robô, os dois consomem o</text>
  <text x="146" y="481" text-anchor="middle" font-size="9" fill="#991b1b">mesmo par de motores: roll</text>
  <text x="146" y="494" text-anchor="middle" font-size="9" fill="#991b1b">agressivo rouba pitch.</text>
  <text x="146" y="515" text-anchor="middle" font-size="8.5" font-weight="600" fill="#b91c1c">a divergência que mais importa</text>

  <rect x="264" y="392" width="212" height="136" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="370" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">(b) Teto móvel</text>
  <text x="370" y="436" text-anchor="middle" font-size="9" fill="#9a3412">±73,1 / ±17,2 N·m é a projeção</text>
  <text x="370" y="449" text-anchor="middle" font-size="9" fill="#9a3412">num ponto de operação.</text>
  <text x="370" y="468" text-anchor="middle" font-size="9" fill="#9a3412">O jacobiano do 4-barras varia</text>
  <text x="370" y="481" text-anchor="middle" font-size="9" fill="#9a3412">com o ângulo — dois motores</text>
  <text x="370" y="494" text-anchor="middle" font-size="9" fill="#9a3412">iguais, alavancas diferentes.</text>
  <text x="370" y="515" text-anchor="middle" font-size="8.5" font-weight="600" fill="#c2410c">pitch ganha, roll paga</text>

  <rect x="488" y="392" width="212" height="136" rx="6" fill="#fefce8" stroke="#ca8a04"/>
  <text x="594" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">(c) armature ajustada</text>
  <text x="594" y="436" text-anchor="middle" font-size="9" fill="#854d0e">Cinco dos sete grupos batem</text>
  <text x="594" y="449" text-anchor="middle" font-size="9" fill="#854d0e">com rotor_inertia · gear².</text>
  <text x="594" y="468" text-anchor="middle" font-size="9" fill="#854d0e">O tornozelo não: os valores são</text>
  <text x="594" y="481" text-anchor="middle" font-size="9" fill="#854d0e">inércias efetivas do mecanismo,</text>
  <text x="594" y="494" text-anchor="middle" font-size="9" fill="#854d0e">não do rotor.</text>
  <text x="594" y="515" text-anchor="middle" font-size="8.5" font-weight="600" fill="#a16207">booster.py:21-23</text>

  <rect x="712" y="392" width="212" height="136" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="818" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">(d) O clamp é o do cfg</text>
  <text x="818" y="436" text-anchor="middle" font-size="9" fill="#166534">O forcerange do XML está fora</text>
  <text x="818" y="449" text-anchor="middle" font-size="9" fill="#166534">do laço; vale effort_limit.</text>
  <text x="818" y="468" text-anchor="middle" font-size="9" fill="#166534">Pitch 24 e roll 15 N·m — a sim</text>
  <text x="818" y="481" text-anchor="middle" font-size="9" fill="#166534">já é mais conservadora que o</text>
  <text x="818" y="494" text-anchor="middle" font-size="9" fill="#166534">próprio modelo, por acidente.</text>
  <text x="818" y="515" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803d">mujoco_controller.py:217-225</text>

  <text x="480" y="556" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Modelo mental: serial é a escolha certa — e ela se sustenta enquanto os cinco elos falarem o mesmo espaço.</text>
  <text x="480" y="574" text-anchor="middle" font-size="11" fill="#334155">treino  ==  MJCF  ==  joint_names  ==  cmd_type  ==  kp / kd / effort_limit</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
</svg>
