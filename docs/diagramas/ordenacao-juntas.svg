<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Três ordenações de juntas em jogo</text>
  <text x="450" y="52" text-anchor="middle" font-size="11" fill="#64748b">RobotData mantém os índices de permutação entre elas (real2sim_joint_indexes / sim2real_joint_indexes)</text>

  <!-- Column 1: real/SDK -->
  <rect x="40" y="80" width="240" height="380" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Ordem real / SDK</text>
  <text x="160" y="120" text-anchor="middle" font-size="9" fill="#1e40af">RobotCfg.joint_names</text>

  <g font-size="9" fill="#1e293b">
    <rect x="60" y="132" width="200" height="20" fill="#dbeafe"/><text x="70" y="146">0-1  Head Yaw/Pitch</text>
    <rect x="60" y="152" width="200" height="20" fill="#ffffff"/><text x="70" y="166">2-5  Left Arm (4)</text>
    <rect x="60" y="172" width="200" height="20" fill="#dbeafe"/><text x="70" y="186">6-9  Right Arm (4)</text>
    <rect x="60" y="192" width="200" height="20" fill="#ffffff"/><text x="70" y="206">10   Waist</text>
    <rect x="60" y="212" width="200" height="20" fill="#fee2e2"/><text x="70" y="226">11-14 Left Leg (hip×3, knee)</text>
    <rect x="60" y="232" width="200" height="20" fill="#fecaca"/><text x="70" y="246">15-16 Left Ankle P/R (SERIAL)</text>
    <rect x="60" y="252" width="200" height="20" fill="#fee2e2"/><text x="70" y="266">17-20 Right Leg (hip×3, knee)</text>
    <rect x="60" y="272" width="200" height="20" fill="#fecaca"/><text x="70" y="286">21-22 Right Ankle P/R (SERIAL)</text>
  </g>
  <text x="160" y="305" text-anchor="middle" font-size="9" fill="#7f1d1d" font-weight="600">15/16, 21/22: mesmos slots</text>
  <text x="160" y="318" text-anchor="middle" font-size="9" fill="#7f1d1d" font-weight="600">= crank em modo PARALLEL</text>

  <rect x="60" y="340" width="200" height="100" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="160" y="358" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">cmd_type usado pelo</text>
  <text x="160" y="371" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">booster_deploy: SERIAL</text>
  <text x="160" y="390" text-anchor="middle" font-size="8" fill="#475569">política enxerga tornozelo</text>
  <text x="160" y="402" text-anchor="middle" font-size="8" fill="#475569">como pitch/roll independentes,</text>
  <text x="160" y="414" text-anchor="middle" font-size="8" fill="#475569">não como o mecanismo físico</text>

  <!-- Column 2: sim -->
  <rect x="330" y="80" width="240" height="380" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Ordem de simulação</text>
  <text x="450" y="120" text-anchor="middle" font-size="9" fill="#166534">RobotCfg.sim_joint_names</text>
  <text x="450" y="134" text-anchor="middle" font-size="9" fill="#166534">(IsaacLab, ordem BFS)</text>

  <rect x="350" y="150" width="200" height="60" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="450" y="170" text-anchor="middle" font-size="9" fill="#14532d">Ordem completamente diferente</text>
  <text x="450" y="184" text-anchor="middle" font-size="9" fill="#14532d">da ordem real — usada pelo</text>
  <text x="450" y="197" text-anchor="middle" font-size="9" fill="#14532d">MJCF e por MotionLoader</text>

  <rect x="350" y="225" width="200" height="60" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="450" y="245" text-anchor="middle" font-size="9" font-weight="600" fill="#78350f">T1_23DOF_CFG.sim_body_names</text>
  <text x="450" y="260" text-anchor="middle" font-size="9" fill="#92400e">está VAZIO — MotionLoader depende</text>
  <text x="450" y="273" text-anchor="middle" font-size="9" fill="#92400e">do próprio .npz trazer body_names</text>

  <!-- Column 3: policy -->
  <rect x="620" y="80" width="240" height="380" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="740" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Ordem da política</text>
  <text x="740" y="120" text-anchor="middle" font-size="9" fill="#5b21b6">PolicyCfg.policy_joint_names</text>
  <text x="740" y="134" text-anchor="middle" font-size="9" fill="#5b21b6">(quando presente)</text>

  <rect x="640" y="150" width="200" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="740" y="170" text-anchor="middle" font-size="9" fill="#4c1d95">A ordem que a rede foi</text>
  <text x="740" y="184" text-anchor="middle" font-size="9" fill="#4c1d95">treinada para consumir —</text>
  <text x="740" y="198" text-anchor="middle" font-size="9" fill="#4c1d95">pode divergir das outras duas</text>
  <text x="740" y="211" text-anchor="middle" font-size="9" fill="#4c1d95">e varia por tarefa</text>

  <!-- Arrows between columns -->
  <line x1="280" y1="200" x2="325" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="325" y1="220" x2="280" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#e1)"/>
  <text x="302" y="192" text-anchor="middle" font-size="8" fill="#334155">real2sim</text>
  <text x="302" y="235" text-anchor="middle" font-size="8" fill="#334155">sim2real</text>

  <line x1="570" y1="200" x2="615" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#e1)" stroke-dasharray="3 3"/>
  <text x="592" y="192" text-anchor="middle" font-size="8" fill="#334155">por tarefa</text>

  <text x="450" y="480" text-anchor="middle" font-size="11" fill="#334155">base_controller.py:29-30 mantém os índices que traduzem entre a ordem real e a de simulação.</text>
  <text x="450" y="497" text-anchor="middle" font-size="11" fill="#334155">A tradução para/da ordem da política é responsabilidade de cada Policy específica.</text>

  <defs>
    <marker id="e1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
</svg>
